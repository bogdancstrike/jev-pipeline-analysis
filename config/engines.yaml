# The model engines. Each module's YAML (config/modules/<module>.yaml) names one with
# `engine: <name>`; replacing the model behind a task is that one line. Only engines that an
# enabled module uses are contacted, so an unused engine's service need not be running.
#
# Kinds:
#   systemone  any server speaking POST /v1/systemone (Laya, Kev, the vLLM decider, hosted Jev)
#              -> closed questions: choice / yes-no, calibrated probabilities. Ports: classify, ask.
#   gliner2    the GLiNER2 extractor service (extractor/) -> entities, relations, structured
#              fields, classification, from one encoder pass. Ports: extract, classify.
#
# Keys: `api_key_secret` names a file in /run/secrets (generated by secrets-init).
# After editing: `docker compose restart backend` (and start the service an engine points to).

engines:
  # ---------------------------------------------------------------- GLiNER2.5 (Fastino)
  # Named entities, relations, structured fields, taxonomy. Apache-2.0, encoders, GPU or CPU.
  gliner:
    kind: gliner2
    description: GLiNER2.5-Decide 340M (English) + GLiNER2.5-multi-Decide 287M (other languages)
    url: http://extractor:8080
    api_key_secret: extractor_api_key
    # A checkpoint alias loaded by the extractor (see extractor/Dockerfile EXTRACTOR_MODELS), or a
    # per-language route: GLiNER2.5-Decide is English-only, its multilingual twin covers the rest.
    model: {en: decide, "*": decide-multi}
    threshold: 0.5
    chunk_size: 384        # words per window for long documents (the service merges windows)
    chunk_overlap: 64
    batch_size: 16         # texts per forward pass inside the service
    max_texts_per_request: 32
    concurrency: 2         # requests in flight (the service serializes GPU work anyway)

  # ---------------------------------------------------------------- Laya (Convai Innovations)
  # Relevance, risk, sentiment, categories, routing, calibrated confidence. Apache-2.0,
  # 421M English + 322M multilingual (100+ languages) encoders, routed per request.
  laya:
    kind: systemone
    description: Laya 421M (English) + Laya multilingual 322M, calibrated decisions
    url: http://laya:8000
    api_key_secret: laya_api_key
    ready_path: /health
    models_path: null              # laya-serve publishes no limits: they are set here
    limits:
      max_sequence_tokens: 2048    # = request.max_len below; longer texts are split and aggregated
      max_question_tokens: 512
    chars_per_token: 3.2
    request:
      max_len: 2048                # context per pass (multilingual checkpoint goes up to 8,192)
    batch:                         # many documents, one question set, shared forward passes
      path: /v1/systemone/batch
      max_states: 32
    concurrency: 4                 # laya-serve answers 503 + retry-after past LAYA_MAX_CONCURRENT

  # ---------------------------------------------------------------- Kev (optional)
  # Kev 0.8B / 4B: LoRA + pointer head on Qwen3.5, System One wire-compatible. Start it with
  # `docker compose --profile kev up -d kev`, then point modules at `engine: kev`.
  kev:
    kind: systemone
    description: Kev 0.8B (Qwen3.5 + LoRA pointer head)
    url: http://kev:8009
    api_key_secret: kev_api_key
    ready_path: /v1/models
    models_path: null
    limits:
      max_sequence_tokens: 8192
      max_question_tokens: 1024
    chars_per_token: 3.5
    concurrency: 4

  # ---------------------------------------------------------------- Qwen3-4B on vLLM (optional)
  # The original generative-model path: exact option log-probabilities from Qwen3-4B AWQ.
  # `docker compose --profile qwen up -d llm decider`, then `engine: qwen`.
  qwen:
    kind: systemone
    description: Qwen3-4B-Instruct AWQ on vLLM (logprob decider)
    url: http://decider:8000
    api_key_secret: decision_api_key
    ready_path: /readyz
    models_path: /v1/models        # the decider publishes its exact token limits
    chars_per_token: 3.5
    concurrency: 6
