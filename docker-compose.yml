name: decision-csv-poc

# docker compose up --build -d      -> UI on http://localhost:8088 (UI_PORT)
#
# browser -> frontend (nginx) -> backend (FastAPI: core + modules) -+-> extractor  GLiNER2.5 (entities, relations,
#                                                                   |               fields, taxonomy)          [GPU]
#                                                                   +-> laya       Laya decisions (relevance, risk,
#                                                                                   routing, sentiment, ...)   [GPU]
# Optional engines (config/engines.yaml), off by default:
#   docker compose --profile kev  up -d kev            Kev-0.8B, System One API          [GPU]
#   docker compose --profile qwen up -d llm decider    Qwen3-4B AWQ on vLLM + decider    [GPU]
#
# * Everything is on-prem. Model weights are downloaded once, at BUILD time, into the images.
#   At RUNTIME the model containers sit on an internal network with no route to the internet.
# * No .env needed: secrets-init generates random service tokens into the `secrets` volume on
#   first start (and keeps them on later starts).

x-gpu: &gpu
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            device_ids: ["0"]        # the RTX 3080; llm and ner share it
            capabilities: [gpu]

x-secrets: &secrets
  volumes:
    - secrets:/run/secrets:ro

x-after-secrets: &after-secrets
  secrets-init:
    condition: service_completed_successfully

services:
  secrets-init:
    image: busybox:1.37
    network_mode: none
    volumes:
      - secrets:/run/secrets
    command:
      - sh
      - -c
      - |
        set -e
        for n in decision_api_key llm_api_key extractor_api_key laya_api_key kev_api_key postgres_password; do
          f=/run/secrets/$$n
          if [ ! -s "$$f" ]; then
            head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > "$$f"
            echo "generated $$n"
          fi
        done
        chmod 0444 /run/secrets/*
    restart: "no"

  llm:
    profiles: [qwen]
    build:
      context: ./vllm
      args:
        LLM_MODEL_REPO: ${LLM_MODEL_REPO:-cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit}
        LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-main}
    image: decision-csv-poc/llm-vllm:latest
    <<: [*gpu, *secrets]
    command:
      - --served-model-name
      - ${LLM_SERVED_NAME:-local/qwen3-4b-instruct-2507-awq}
      - --max-model-len
      - "${LLM_MAX_MODEL_LEN:-6144}"        # 4k-token text + ~550 tokens of question/options
      - --kv-cache-memory-bytes
      - "${LLM_KV_CACHE_BYTES:-1610612736}" # 1.5 GiB = ~10.9k tokens: deterministic VRAM, no greedy grab
      # vLLM refuses to start unless this share of the WHOLE card is free at startup, even with
      # the KV cache sized in bytes. The 0.92 default fails on a 10 GB card that also runs
      # GLiNER and a desktop. ~6 GB covers weights 2.8 + KV 1.5 + activations/runtime.
      - --gpu-memory-utilization
      - "${LLM_GPU_MEMORY_UTILIZATION:-0.62}"
      - --max-num-seqs
      - "8"
      - --max-num-batched-tokens
      - "2048"                              # chunked prefill size; bounds activation memory
      - --max-logprobs
      - "128"                               # allows logprob_token_ids for up to 128 options
      - --enforce-eager                     # prefill-only workload: CUDA graphs buy ~nothing here
      - --enable-prefix-caching             # the system+options prefix is shared by every row
      - --generation-config
      - vllm                                # ignore the repo's sampling defaults
      - --uvicorn-log-level
      - warning
    shm_size: 2gb
    networks: [models]
    depends_on: *after-secrets
    read_only: true
    # Triton JIT-compiles kernels into /tmp/triton and loads them as shared objects, so this
    # tmpfs needs exec (Docker's default is noexec). The root filesystem stays read-only.
    tmpfs: ["/tmp:exec,size=4g"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 300s
      retries: 3
    restart: unless-stopped

  decider:
    profiles: [qwen]
    build:
      context: ./decider
      args:   # same repo + revision as llm: tokenizers must match (checked again at startup)
        LLM_MODEL_REPO: ${LLM_MODEL_REPO:-cyankiwi/Qwen3-4B-Instruct-2507-AWQ-4bit}
        LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-main}
    image: decision-csv-poc/decider:latest
    <<: *secrets
    environment:
      LLM_URL: http://llm:8000
      LLM_API_KEY_FILE: /run/secrets/llm_api_key
      DECIDER_API_KEY_FILE: /run/secrets/decision_api_key
      ASSISTANT_PREFIX: ${ASSISTANT_PREFIX:-}
    networks: [models]
    depends_on: *after-secrets
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  extractor:
    build: ./extractor
    image: decision-csv-poc/extractor:latest
    <<: [*gpu, *secrets]
    environment:
      EXTRACTOR_API_KEY_FILE: /run/secrets/extractor_api_key
      EXTRACTOR_GPU_MEM_FRACTION: "0.35"   # hard cap ~3.4 GB: ~2 GB bf16 weights + activations
      EXTRACTOR_RELEASE_ABOVE_MB: "2500"   # give cached memory back so Laya never runs out
      EXTRACTOR_DTYPE: bfloat16
      EXTRACTOR_LOAD_OPTIONS: ${EXTRACTOR_LOAD_OPTIONS:-{}}
      TRITON_CACHE_DIR: /tmp/triton
      HOME: /tmp
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    networks: [models]
    depends_on: *after-secrets
    read_only: true
    tmpfs: ["/tmp:exec,size=2g"]       # Triton JIT kernels are loaded from here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz',timeout=2).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      start_period: 240s
      retries: 3
    restart: unless-stopped

  laya:
    build: ./laya
    image: decision-csv-poc/laya:latest
    <<: [*gpu, *secrets]
    environment:
      LAYA_DEVICE: cuda
      LAYA_MODELS: english,multilingual    # preloaded; requests are routed per language
      LAYA_MAX_TOKEN_BUDGET: "4096"        # cap on per-request max_len
      LAYA_MAX_CONCURRENT: "32"
      # Bound one forward pass (states x questions x max_len tokens): laya-serve splits bigger
      # batches. Without it, PyTorch's caching allocator keeps the biggest batch's activations
      # (measured: 6.5 GB) and starves the extractor sharing the card.
      LAYA_MAX_BATCH_TOKENS: "16384"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    networks: [models]
    depends_on: *after-secrets
    read_only: true
    tmpfs: ["/tmp:exec,size=2g"]           # torch kernel caches
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  kev:
    profiles: [kev]
    build: ./kev
    image: decision-csv-poc/kev:latest
    <<: [*gpu, *secrets]
    networks: [models]
    depends_on: *after-secrets
    read_only: true
    tmpfs: ["/tmp:exec,size=2g"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: triage
      POSTGRES_USER: triage
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - secrets:/run/secrets:ro
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    depends_on: *after-secrets
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triage -d triage"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    image: decision-csv-poc/backend:latest
    environment:
      SECRETS_DIR: /run/secrets          # engine API keys (names in config/engines.yaml)
      ENGINES_PATH: /config/engines.yaml # the models: URLs, limits, batching
      MODULES_DIR: /config/modules       # one YAML per module: engine, labels, prompts, thresholds
      SAMPLES_DIR: /samples
      POSTGRES_HOST: postgres            # settings overrides + run history (password: secret file)
      MAX_UPLOAD_MB: "512"
    volumes:
      - secrets:/run/secrets:ro
      - ./config:/config:ro                   # edit + `docker compose restart backend`
      - ./samples:/samples:ro
    networks: [models, data, edge]
    depends_on:                         # models load in the background; the UI shows progress
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: decision-csv-poc/frontend:latest
    ports: ["${UI_PORT:-8088}:8080"]
    networks: [edge]
    depends_on: [backend]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  secrets: {}
  pgdata: {}

networks:
  models:
    internal: true    # no egress for anything that touches model weights or text
  data:
    internal: true    # postgres: reachable by the backend only
  edge: {}
